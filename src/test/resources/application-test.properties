# ── Datasource ──────────────────────────────────────────────
# MODE=MySQL makes H2 behave like MySQL (same SQL syntax)
# DB_CLOSE_ON_EXIT=FALSE keeps the DB alive for the full test run
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Hibernate ────────────────────────────────────────────────
# create-drop: create tables at start, drop at end
spring.jpa.hibernate.ddl-auto=create-drop

# CRITICAL: This tells Hibernate to actually generate DDL and run it
spring.jpa.generate-ddl=true

# Use H2 dialect — NOT MySQL dialect in tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Show SQL so we can see what's happening
spring.jpa.show-sql=true

# ── JWT (required to prevent context startup failure) ────────
jwt.secret=test-secret-key-for-ci-minimum-32-characters-long
jwt.expiration=86400000