# Use H2 in-memory database for repository tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates schema from your @Entity classes automatically
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Show SQL in test output — useful for debugging
spring.jpa.show-sql=true

# JWT — dummy value for tests, security filters are mocked anyway
jwt.secret=test-secret-key-for-ci-minimum-32-characters-long
jwt.expiration=86400000