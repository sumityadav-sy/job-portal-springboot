spring.application.name=jobportal
# ─── DATABASE ──────────────────────────────────────────────────
# "mysql" is the service name from docker-compose — Docker resolves
# it to the MySQL container's IP on the shared network
spring.datasource.url=jdbc:mysql://mysql:3306/jobportal

# ${DB_USERNAME} means: read this value from environment variable DB_USERNAME
# Spring Boot supports this syntax natively — no extra library needed
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / HIBERNATE ───────────────────────────────────────────
# update = create tables if they don't exist, update if schema changed
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ─── JWT ───────────────────────────────────────────────────────
# also from environment — never hardcode secrets
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000